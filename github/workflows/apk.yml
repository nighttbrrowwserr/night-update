name: apk
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.7}
      - run: gradle assembleDebug --no-daemon -PvCode=${{ github.run_number }} -PfeedUrl=https://github.com/${{ github.repository }}/releases/download/latest/latest-android.json
      - name: Publier la mise a jour
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk night.apk
          echo "{\"version\":${{ github.run_number }},\"apk\":\"https://github.com/${{ github.repository }}/releases/download/latest/night.apk\",\"notes\":\"Nouvelle version de night disponible.\"}" > latest-android.json
          gh release delete latest -y --cleanup-tag || true
          gh release create latest night.apk latest-android.json -t latest -n "night mobile"
